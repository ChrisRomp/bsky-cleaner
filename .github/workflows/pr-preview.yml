name: PR Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload PR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: ./dist
          retention-days: 7
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const runId = context.runId;
            const artifactName = `pr-preview-${prNumber}`;
            
            const comment = `## 🚀 Preview Build Ready
            
            A preview build has been created for this PR. You can:
            
            1. Download the build artifact from the [Actions run](https://github.com/${{ github.repository }}/actions/runs/${runId})
            2. Extract the \`${artifactName}\` artifact
            3. Serve it locally with: \`npx serve dist\`
            4. Or deploy it to any static hosting service for testing
            
            ### Quick Local Test:
            \`\`\`bash
            # After downloading and extracting the artifact
            cd dist
            npx serve -l 3000
            # Open http://localhost:3000/bsky-cleaner/
            \`\`\`
            
            The artifact will be kept for 7 days.`;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
